<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PageForge — Word processor in your browser</title>
<meta name="description" content="PageForge is a free, offline word processor that runs in your browser: page layout, styles, tables, charts, equations, references, track changes, mail merge and Word export.">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>/* ===== PageForge — app styles ===== */
:root{
  --bg:#eef1f7; --panel:#ffffff; --panel2:#f6f7fb; --line:#dde1ea; --text:#1d2330; --muted:#667085;
  --brand:#4f46e5; --brand2:#2563eb; --hover:#eef2ff; --active:#e0e7ff; --danger:#dc2626; --ok:#16a34a;
  --tab-accent:#2563eb; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.08);
  --radius:8px; --ui-font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
body.pf-dark{
  --bg:#171a21; --panel:#222631; --panel2:#1c2029; --line:#343a48; --text:#e6e9f0; --muted:#9aa3b5;
  --hover:#2c3242; --active:#353d52; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--ui-font);font-size:13px;color:var(--text);background:var(--bg);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:auto auto auto 1fr auto;grid-template-columns:minmax(0,1fr);height:100vh;height:100dvh}
/* title bar */
#pf-title{display:flex;align-items:center;gap:10px;padding:6px 12px;background:linear-gradient(90deg,#312e81,#4f46e5 45%,#2563eb);color:#fff}
#pf-logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:.2px;white-space:nowrap}
#pf-logo svg{width:22px;height:22px}
#pf-docname{background:rgba(255,255,255,.12);border:1px solid transparent;border-radius:6px;color:#fff;padding:4px 8px;min-width:160px;max-width:340px}
#pf-docname:focus{outline:none;border-color:rgba(255,255,255,.6);background:rgba(255,255,255,.2)}
#pf-savestate{font-size:12px;opacity:.85;white-space:nowrap}
#pf-label-chip{font-size:11px;padding:2px 8px;border-radius:10px;background:#fff3;display:none}
#pf-search{margin-left:auto;display:flex;align-items:center;background:rgba(255,255,255,.15);border-radius:6px;padding:0 8px;width:min(340px,30vw)}
#pf-search input{background:transparent;border:0;color:#fff;padding:5px 6px;width:100%;outline:none}
#pf-search input::placeholder{color:#e0e7ff}
.pf-tbtn{background:transparent;border:0;color:#fff;border-radius:6px;padding:5px 8px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pf-tbtn:hover{background:rgba(255,255,255,.16)}
.pf-tbtn svg{width:18px;height:18px}
.pf-avatar{width:26px;height:26px;border-radius:50%;background:#f59e0b;color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
/* tabs */
#pf-tabs{display:flex;gap:2px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.pf-tab{border:0;background:transparent;padding:8px 13px 7px;cursor:pointer;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap}
.pf-tab:hover{color:var(--text);background:var(--hover)}
.pf-tab.on{color:var(--tab-c,var(--brand2));border-bottom-color:var(--tab-c,var(--brand2))}
.pf-tab.file{color:#fff;background:var(--brand);border-radius:6px 6px 0 0;margin-top:3px}
/* ribbon */
#pf-ribbon{display:flex;align-items:stretch;gap:0;background:var(--panel);border-bottom:1px solid var(--line);padding:6px 8px 2px;overflow-x:auto;min-height:104px;box-shadow:0 2px 6px rgba(16,24,40,.04)}
#pf-ribbon.collapsed{display:none}
.pf-group{display:flex;flex-direction:column;padding:0 8px;border-right:1px solid var(--line);flex:none}
.pf-group:last-child{border-right:0}
.pf-gbody{display:flex;gap:2px;align-items:flex-start;flex:1}
.pf-gcol{display:flex;flex-direction:column;gap:2px}
.pf-grow{display:flex;gap:2px;align-items:center}
.pf-gname{font-size:11px;color:var(--muted);text-align:center;padding:3px 0 2px}
.pf-btn{display:flex;align-items:center;gap:5px;border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 6px;cursor:pointer;white-space:nowrap;color:var(--text);min-height:26px}
.pf-btn:hover{background:var(--hover);border-color:var(--line)}
.pf-btn.on{background:var(--active);border-color:#c7d2fe}
.pf-btn:disabled{opacity:.4;cursor:default}
.pf-btn svg{width:17px;height:17px;flex:none}
.pf-btn.big{flex-direction:column;justify-content:flex-start;gap:3px;padding:4px 6px;min-width:52px;max-width:76px;white-space:normal;text-align:center;line-height:1.15;font-size:12px}
.pf-btn.big svg{width:28px;height:28px}
.pf-btn.icon{padding:4px;min-width:26px;justify-content:center}
.pf-btn .dd{font-size:9px;opacity:.6;margin-left:-2px}
.pf-select{height:26px;border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:0 4px}
.pf-num{width:58px;height:26px;border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:0 4px}
.pf-colorbar{display:block;height:4px;width:16px;margin-top:-3px;border-radius:1px}
.pf-colorbtn{display:flex;flex-direction:column;align-items:center}
/* style gallery */
.pf-gallery{display:flex;gap:4px;border:1px solid var(--line);border-radius:6px;padding:3px;background:var(--panel2);max-width:340px;overflow:hidden;height:62px}
.pf-gitem{flex:none;width:80px;height:54px;border:1px solid transparent;border-radius:5px;background:var(--panel);cursor:pointer;padding:4px;text-align:left;overflow:hidden;color:#111}
.pf-gitem:hover{border-color:#a5b4fc}
.pf-gitem .pv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:1.2}
.pf-gitem .nm{font-size:10px;color:#667085;display:block;margin-top:2px}
body.pf-dark .pf-gitem{background:#fff}
/* main */
#pf-main{display:flex;min-height:0;position:relative}
#pf-nav,#pf-side{background:var(--panel);border-right:1px solid var(--line);width:270px;flex:none;display:none;flex-direction:column;min-height:0}
#pf-side{border-right:0;border-left:1px solid var(--line);width:360px}
#pf-nav.open,#pf-side.open{display:flex}
.pf-panehead{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700}
.pf-panehead .x{margin-left:auto}
.pf-panebody{overflow:auto;padding:10px 12px;flex:1;min-height:0}
.pf-ptabs{display:flex;border-bottom:1px solid var(--line)}
.pf-ptabs button{flex:1;border:0;background:transparent;padding:7px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted)}
.pf-ptabs button.on{border-bottom-color:var(--brand2);color:var(--text);font-weight:600}
#pf-canvas{flex:1;overflow:auto;position:relative;min-width:0;background:var(--bg)}
#pf-stage{position:relative;padding:28px 60px 80px;width:max-content;min-width:100%;margin:0 auto}
/* status bar */
#pf-status{display:flex;align-items:center;gap:14px;padding:3px 12px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
#pf-status .sp{margin-left:auto}
#pf-status button{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:4px}
#pf-status button:hover{background:var(--hover);color:var(--text)}
#pf-zoom{width:110px;accent-color:var(--brand)}
/* menus */
.pf-menu{position:fixed;z-index:1000;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:5px;min-width:190px;max-height:75vh;overflow:auto}
.pf-mi{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:6px 10px;border-radius:5px;cursor:pointer;white-space:nowrap}
.pf-mi:hover{background:var(--hover)}
.pf-mi svg{width:16px;height:16px}
.pf-msep{height:1px;background:var(--line);margin:4px 2px}
.pf-mhead{font-size:11px;font-weight:700;color:var(--muted);padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.4px}
.pf-grid-picker{display:grid;grid-template-columns:repeat(10,16px);gap:2px;padding:6px}
.pf-grid-picker i{width:16px;height:16px;border:1px solid #cbd5e1;background:#fff;display:block}
.pf-grid-picker i.on{background:#c7d2fe;border-color:#6366f1}
.pf-swatches{display:grid;grid-template-columns:repeat(10,20px);gap:3px;padding:6px}
.pf-swatches button{width:20px;height:20px;border:1px solid rgba(0,0,0,.15);border-radius:3px;cursor:pointer;padding:0}
.pf-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;min-width:330px}
.pf-tile{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:6px;cursor:pointer;text-align:center;font-size:11px}
.pf-tile:hover{border-color:#818cf8;background:var(--hover)}
/* dialogs */
.pf-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:900;display:grid;place-items:center;padding:20px}
.pf-dialog{background:var(--panel);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(560px,96vw);max-height:92vh;display:flex;flex-direction:column}
.pf-dialog header{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px}
.pf-dialog header .x{margin-left:auto}
.pf-dialog .body{padding:16px 18px;overflow:auto}
.pf-dialog footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.pf-b{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 14px;cursor:pointer;font-weight:600}
.pf-b:hover{background:var(--hover)}
.pf-b.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.pf-b.pri:hover{background:#4338ca}
.pf-b.sm{padding:3px 9px;font-size:12px;font-weight:600}
.pf-b.danger{color:var(--danger)}
.pf-form{display:grid;grid-template-columns:150px 1fr;gap:9px 12px;align-items:center}
.pf-form label{color:var(--muted);font-size:12px}
.pf-form .full{grid-column:1/-1}
.pf-in{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel)}
textarea.pf-in{min-height:80px;resize:vertical;font-family:inherit}
.pf-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pf-note{font-size:12px;color:var(--muted);line-height:1.45}
.pf-card{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--panel)}
.pf-card.on{border-color:#818cf8;box-shadow:0 0 0 2px #e0e7ff}
.pf-pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:var(--panel2);border:1px solid var(--line)}
.pf-dtabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.pf-dtabs button{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:5px 10px;cursor:pointer}
.pf-dtabs button.on{background:var(--active);border-color:#a5b4fc;font-weight:600}
.pf-sheet{border-collapse:collapse;font-size:12px}
.pf-sheet td,.pf-sheet th{border:1px solid var(--line);padding:0;min-width:70px}
.pf-sheet th{background:var(--panel2);font-weight:600;padding:3px 6px}
.pf-sheet input{border:0;width:100%;padding:4px 6px;background:transparent;outline:none}
.pf-sheet input:focus{background:#eef2ff;color:#111}
#pf-toasts{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.pf-toast{background:#1e293b;color:#fff;padding:9px 16px;border-radius:8px;box-shadow:var(--shadow);font-size:13px;animation:pfin .2s}
@keyframes pfin{from{opacity:0;transform:translateY(8px)}}
.pf-banner{display:flex;align-items:center;gap:10px;padding:7px 14px;background:#fef3c7;color:#78350f;border-bottom:1px solid #fde68a;font-size:12.5px}
.pf-banner.info{background:#e0f2fe;color:#075985;border-color:#bae6fd}
/* backstage */
#pf-backstage{position:fixed;inset:0;z-index:800;background:var(--panel);display:none;grid-template-columns:230px 1fr}
#pf-backstage.open{display:grid}
#pf-bs-nav{background:linear-gradient(180deg,#312e81,#4338ca);color:#fff;padding:14px 8px;display:flex;flex-direction:column;gap:2px}
#pf-bs-nav button{border:0;background:transparent;color:#fff;text-align:left;padding:9px 14px;border-radius:7px;cursor:pointer;font-size:14px;display:flex;gap:10px;align-items:center}
#pf-bs-nav button:hover,#pf-bs-nav button.on{background:rgba(255,255,255,.16)}
#pf-bs-nav svg{width:18px;height:18px}
#pf-bs-body{overflow:auto;padding:28px 40px}
#pf-bs-body h2{margin:0 0 16px;font-size:24px;font-weight:600}
#pf-bs-body h3{margin:22px 0 10px;font-size:15px}
.pf-tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.pf-tpl{cursor:pointer;border-radius:8px;text-align:center;font-size:12.5px}
.pf-tpl .th{height:190px;border:1px solid var(--line);border-radius:6px;background:#fff;overflow:hidden;position:relative;margin-bottom:6px;box-shadow:var(--shadow);transition:transform .15s}
.pf-tpl:hover .th{transform:translateY(-3px);border-color:#818cf8}
.pf-tpl .th .mini{position:absolute;left:0;top:0;width:794px;transform:scale(.19);transform-origin:0 0;pointer-events:none;color:#000}
.pf-list{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pf-li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.pf-li:last-child{border-bottom:0}
.pf-li:hover{background:var(--hover)}
.pf-li .meta{margin-left:auto;color:var(--muted);font-size:12px}
/* nav pane */
.pf-navh{display:block;width:100%;text-align:left;border:0;background:transparent;padding:5px 8px;border-radius:5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid transparent}
.pf-navh:hover{background:var(--hover)}
.pf-navh.cur{border-left-color:var(--brand2);background:var(--hover)}
.pf-navh.drag-over{box-shadow:inset 0 2px 0 var(--brand2)}
.pf-thumbs{display:grid;gap:14px;justify-items:center}
.pf-thumb{cursor:pointer;text-align:center;font-size:11px;color:var(--muted)}
.pf-thumb .box{border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;position:relative;background:#fff}
.pf-thumb .box>div{transform-origin:0 0;position:absolute;left:0;top:0;pointer-events:none}
.pf-result{padding:7px 8px;border-radius:6px;cursor:pointer;font-size:12.5px;line-height:1.4}
.pf-result:hover{background:var(--hover)}
.pf-result mark{background:#fde047;color:#000}

/* ===== document canvas ===== */
#pf-doc{outline:none;position:relative;margin:0 auto}
#pf-doc .pf-sec{background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 3px 14px rgba(16,24,40,.12);margin:0 auto 26px;position:relative;color:#000;background-repeat:repeat-y;background-position:0 0}
#pf-doc .pf-sec::before{content:attr(data-label);position:absolute;top:-19px;left:0;font-size:10.5px;color:#8a94a6;font-family:var(--ui-font);white-space:nowrap}
#pf-doc .pf-sec[data-break="continuous"]{margin-top:-26px;box-shadow:0 3px 14px rgba(16,24,40,.12)}
.pf-hfprev{position:absolute;left:0;right:0;font-size:9pt;color:#9aa3b5;font-family:var(--ui-font);cursor:pointer;display:flex;padding:0 var(--mr) 0 var(--ml);user-select:none}
.pf-hfprev>span{flex:1}.pf-hfprev>span:nth-child(2){text-align:center}.pf-hfprev>span:nth-child(3){text-align:right}
.pf-hfprev:hover{color:#4f46e5;background:rgba(79,70,229,.05)}
#pf-marks{position:absolute;left:0;top:0;width:100%;height:0;pointer-events:none;z-index:3}
.pf-mark{position:absolute;height:0;border-top:2px dashed #c7cfdd}
.pf-mark span{position:absolute;right:100%;top:-9px;margin-right:8px;font-size:10px;color:#8a94a6;font-family:var(--ui-font);white-space:nowrap;background:var(--bg);padding:0 4px;border-radius:3px}
#pf-notes-edit{margin:-6px auto 30px;background:#fff;box-shadow:0 3px 14px rgba(16,24,40,.12);padding:14px 22px;color:#000;display:none}
#pf-notes-edit.on{display:block}
#pf-notes-edit h4{margin:6px 0;font:600 11px var(--ui-font);color:#667085;text-transform:uppercase;letter-spacing:.5px}
.pf-note-row{display:flex;gap:8px;font-size:10pt;margin:3px 0;align-items:flex-start}
.pf-note-row b{min-width:22px;color:#4f46e5;cursor:pointer}
.pf-note-row div{flex:1;outline:none;border-bottom:1px dashed transparent}
.pf-note-row div:focus{border-bottom-color:#c7d2fe}
#pf-pages{display:none}
body.v-print #pf-doc,body.v-print #pf-marks,body.v-print #pf-notes-edit{display:none}
body.v-print #pf-pages{display:flex;flex-direction:column;align-items:center;gap:22px}
body.v-web #pf-doc .pf-sec{width:auto!important;max-width:none}
body.v-web #pf-marks{display:none}
body.v-focus #pf-tabs,body.v-focus #pf-ribbon,body.v-focus #pf-nav,body.v-focus #pf-side,body.v-focus #pf-title{display:none!important}
body.v-focus #app{grid-template-rows:0 0 0 1fr auto}
#pf-ghost{position:absolute;color:#9aa3b5;pointer-events:none;z-index:4;white-space:pre;display:none}
#pf-ghost.on{display:block}
#pf-ghost kbd{font:10px var(--ui-font);border:1px solid #cbd5e1;border-radius:3px;padding:0 3px;margin-left:4px;color:#64748b;background:#f8fafc;vertical-align:2px}
#pf-objbar{position:absolute;z-index:6;display:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:3px;gap:2px}
#pf-objbar.on{display:flex}
#pf-handle{position:absolute;width:12px;height:12px;background:#4f46e5;border:2px solid #fff;border-radius:3px;cursor:nwse-resize;z-index:7;display:none}
#pf-handle.on{display:block}
#pf-dictbubble{position:fixed;bottom:44px;right:24px;background:#111827;color:#fff;border-radius:12px;padding:10px 14px;max-width:360px;z-index:950;display:none;box-shadow:var(--shadow)}
#pf-dictbubble.on{display:block}
#pf-dictbubble .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ef4444;margin-right:8px;animation:pfp 1s infinite}
@keyframes pfp{50%{opacity:.3}}

/* ===== document content (shared by edit view and pages) ===== */
.pf-content{font-family:var(--pf-body-font,Calibri,Carlito,"Segoe UI",Arial,sans-serif);font-size:11pt;line-height:1.15;color:#000;word-wrap:break-word;overflow-wrap:break-word;font-kerning:normal}
.pf-content p,.pf-content h1,.pf-content h2,.pf-content h3,.pf-content h4,.pf-content h5,.pf-content h6,.pf-content blockquote,.pf-content pre{margin:0 0 8pt}
.pf-content ul,.pf-content ol{margin:0 0 8pt;padding-left:.33in}
.pf-content li{margin:0}
.pf-content li>ul,.pf-content li>ol{margin-bottom:0}
.pf-content.hyph{hyphens:auto;-webkit-hyphens:auto}
.pf-content [data-nohyph]{hyphens:manual}
.pf-content a{color:#0563c1}
.pf-content img{max-width:100%}
.pf-content table{border-collapse:collapse;margin:0 0 8pt;width:100%}
.pf-content td,.pf-content th{border:1px solid #000;padding:2pt 5pt;vertical-align:top;min-width:18px}
.pf-content table.t-none td,.pf-content table.t-none th{border-color:transparent}
.pf-content table.t-lines td,.pf-content table.t-lines th{border-width:0 0 1px;border-color:#9ca3af}
.pf-content table.t-accent th,.pf-content table.t-accent tr.pf-hdr td{background:var(--pf-a1,#4472c4);color:#fff;border-color:var(--pf-a1,#4472c4)}
.pf-content table.t-accent td{border-color:#b4c6e7}
.pf-content table.t-striped tr:nth-child(even) td{background:#f2f2f2}
.pf-content table.t-striped th,.pf-content table.t-striped tr.pf-hdr td{background:#d9e2f3;font-weight:bold}
.pf-content tr.pf-hdr td{font-weight:bold}
.pf-content td.sel,.pf-content th.sel{background:#dbeafe!important;color:#000!important}
.pf-content hr.pf-pb,.pf-content hr.pf-cb{border:0;height:14px;margin:4px 0;position:relative;break-after:column;overflow:visible;clear:both}
.pf-content hr.pf-pb::after,.pf-content hr.pf-cb::after{content:"Page Break";position:absolute;inset:6px 0 auto;border-top:1px dashed #94a3b8;font:9px var(--ui-font);color:#64748b;text-align:center;line-height:0}
.pf-content hr.pf-cb::after{content:"Column Break"}
.pf-content hr.pf-rule{border:0;border-top:1px solid #999;margin:6pt 0}
.pf-content .pf-cont{text-indent:0!important}
.pf-content .pf-cont::before{content:none!important}
.pf-content .pf-cont::first-letter{all:unset}

  L.apply();
});
PF.def('mirrorMargins', () => { PF.D.page.mirror = true; PF.D.page.m = { t: 25.4, r: 25.4, b: 25.4, l: 31.75 }; L.apply(); UI.toast('Mirrored margins: inside 3.18 cm, outside 2.54 cm'); });
PF.def('marginsDialog', async () => {
  const sec = L.curSection(), P = L.props(sec, 0); const cm = v => Math.round(v / 10 * 100) / 100;
  const v = await UI.ask('Page Setup — Margins', [
    { key: 't', label: 'Top (cm)', type: 'number', value: cm(P.mm[0]), step: .1 }, { key: 'b', label: 'Bottom (cm)', type: 'number', value: cm(P.mm[2]), step: .1 },
    { key: 'l', label: 'Left / inside (cm)', type: 'number', value: cm(P.mm[3]), step: .1 }, { key: 'r', label: 'Right / outside (cm)', type: 'number', value: cm(P.mm[1]), step: .1 },
    { key: 'mirror', label: 'Mirror margins (for double-sided printing)', type: 'checkbox', value: !!PF.D.page.mirror },
    { key: 'orient', label: 'Orientation', type: 'select', value: P.orient, options: [['portrait', 'Portrait'], ['landscape', 'Landscape']] },
    { key: 'scope', label: 'Apply to', type: 'select', value: 'doc', options: [['doc', 'Whole document'], ['sec', 'This section']] }
  ]);
  if (!v) return; PF.run('pageSetupApply', v);
}, { ro: 1 });
PF.def('pageSetupApply', v => {
  const mm = [v.t, v.r, v.b, v.l].map(x => (+x || 0) * 10);
  if (v.scope === 'sec') { const s = L.curSection(); s.dataset.m = mm.join(','); s.dataset.orient = v.orient; }
  else { PF.D.page.m = { t: mm[0], r: mm[1], b: mm[2], l: mm[3] }; PF.D.page.orient = v.orient; PF.D.page.mirror = !!v.mirror; L.sections().forEach(s => { delete s.dataset.m; delete s.dataset.orient; }); }
  L.apply();

PF.def('orientation', o => { const secs = scopeSecs(); if (secs) secs.forEach(s => s.dataset.orient = o); else { PF.D.page.orient = o; L.sections().forEach(s => delete s.dataset.orient); } L.apply(); });
PF.def('pageSize', name => { const s = SIZES[name]; if (!s) return; PF.D.page.size = name; PF.D.page.w = s[0]; PF.D.page.h = s[1]; L.apply(); });
PF.def('pageSizeDialog', async () => { const pg = PF.D.page; const v = await UI.ask('Custom paper size', [{ key: 'w', label: 'Width (cm)', type: 'number', value: Math.round(Math.min(pg.w, pg.h)) / 10, step: .1 }, { key: 'h', label: 'Height (cm)', type: 'number', value: Math.round(Math.max(pg.w, pg.h)) / 10, step: .1 }]); if (v && v.w > 2 && v.h > 2) PF.run('pageSizeCustom', v.w * 10, v.h * 10); }, { ro: 1 });
PF.def('pageSizeCustom', (w, hh) => { Object.assign(PF.D.page, { size: 'Custom', w, h: hh }); L.apply(); });
PF.def('columns', async (n) => {
  if (n === 'more') { const sec = L.curSection(); const v = await UI.ask('Columns', [{ key: 'n', label: 'Number of columns', type: 'number', value: +sec.dataset.cols || 2, min: 1, max: 6 }, { key: 'gap', label: 'Spacing (cm)', type: 'number', value: (+sec.dataset.colgap || 12.7) / 10, step: .1 }, { key: 'line', label: 'Line between', type: 'checkbox', value: sec.dataset.colline === '1' }, { key: 'sel', label: 'Apply to selected text only (adds continuous section breaks)', type: 'checkbox', value: false }]); if (!v) return; return applyCols(+v.n, v.gap * 10, v.line, v.sel); }
  applyCols(+n, null, null, false);
});
function applyCols(n, gap, line, selOnly) {
  let sec = L.curSection();
  if (selOnly) { const r = Sel.get(); if (r && !r.collapsed) sec = isolateSelection(r) || sec; }
  if (n > 1) sec.dataset.cols = n; else delete sec.dataset.cols;
  if (gap) sec.dataset.colgap = gap; if (line != null) { if (line) sec.dataset.colline = '1'; else delete sec.dataset.colline; }
  L.apply();
}
function isolateSelection(r) {
  const a = Sel.top(r.startContainer), b = Sel.top(r.endContainer); if (!a || !b) return null; const sec = a.parentElement; if (b.parentElement !== sec) return null;
  const kids = Array.from(sec.children), i = kids.indexOf(a), j = kids.indexOf(b);
  const mk = () => { const s = sec.cloneNode(false); s.removeAttribute('id'); s.dataset.break = 'continuous'; s.removeAttribute('style'); return s; };
  let mid = sec;
  if (i > 0) { mid = mk(); kids.slice(i).forEach(k => mid.append(k)); sec.after(mid); }
  const after = Array.from(mid.children).slice(j - i + 1);
  if (after.length) { const tail = mk(); tail.dataset.cols = sec.dataset.cols || ''; if (!sec.dataset.cols) delete tail.dataset.cols; after.forEach(k => tail.append(k)); mid.after(tail); }
  return mid;
}
PF.def('sectionBreak', type => {
  const r = Sel.get(); const top = r && Sel.top(r.startContainer); if (!top) return UI.toast('Click where the new section should start');
  const sec = top.parentElement;
  let first = top;
  if (top.matches('p,h1,h2,h3,h4,h5,h6') && r.collapsed) { const after = document.createRange(); after.setStart(r.startContainer, r.startOffset); after.setEndAfter(top.lastChild || top); const before = document.createRange(); before.setStartBefore(top.firstChild || top); before.setEnd(r.startContainer, r.startOffset); if (before.toString().trim() || before.cloneContents().querySelector('img,.pf-obj')) { const frag = after.extractContents(); const nb = top.cloneNode(false); nb.removeAttribute('id'); nb.append(frag); if (!nb.textContent && !nb.querySelector('img,br')) nb.append(h('br')); top.after(nb); first = nb; } }
  const ns = sec.cloneNode(false); ns.removeAttribute('style'); ns.dataset.break = type; delete ns.dataset.numstart; delete ns.dataset.hf;
  const kids = Array.from(sec.children); kids.slice(kids.indexOf(first)).forEach(k => ns.append(k)); sec.after(ns);
  if (!sec.firstElementChild) sec.append(h('p', null, h('br')));
  Sel.caret(ns.firstElementChild, 0); L.apply();
  UI.toast(`Section break (${{ next: 'Next Page', continuous: 'Continuous', even: 'Even Page', odd: 'Odd Page' }[type]}) inserted`);
});
PF.def('sectionDialog', async () => {

    { key: 'orient', label: 'Orientation', type: 'select', value: P.orient, options: [['portrait', 'Portrait'], ['landscape', 'Landscape']] },
    { key: 'cols', label: 'Columns', type: 'number', value: P.cols, min: 1, max: 6 },

    { key: 'restart', label: 'Restart page numbering at', type: 'number', value: sec.dataset.numstart || '', placeholder: 'continue from previous section' },

PF.def('lineNumbers', mode => { if (mode === 'suppress') { Sel.blocks().forEach(b => b.toggleAttribute('data-nolinenum')); UI.toast('Line numbers toggled for this paragraph'); return; } PF.D.lineNum.mode = mode; if (mode !== 'none' && PF.view !== 'print') UI.toast('Line numbers show in Page View and when printing'); });
PF.def('lineNumOptions', async () => { const v = await UI.ask('Line numbers', [{ key: 'mode', label: 'Numbering', type: 'select', value: PF.D.lineNum.mode, options: [['none', 'None'], ['continuous', 'Continuous'], ['page', 'Restart each page'], ['section', 'Restart each section']] }, { key: 'start', label: 'Start at', type: 'number', value: PF.D.lineNum.start || 1 }, { key: 'countBy', label: 'Count by', type: 'number', value: PF.D.lineNum.countBy || 1 }]); if (v) PF.run('lineNumSet', v); }, { ro: 1 });

/* ---------- headers & footers ---------- */

  const load = () => { const z = work[variant] || { l: '', c: '', r: '' }; ['l', 'c', 'r'].forEach(k => zones[k].innerHTML = z[k] || ''); };
  vSel.onchange = () => { save(); variant = vSel.value; load(); };
  const fieldSel = h('select', { class: 'pf-select', onchange: e => { const v = e.target.value; if (!v) return; const z = lastZone || zones.c; z.focus(); document.execCommand('insertHTML', false, fieldSpan(v, L.fieldValue(v, null)) + '&nbsp;'); e.target.value = ''; } }, h('option', { value: '' }, 'Insert field…'), FIELDS_HF.map(([c, l]) => h('option', { value: c }, l)));
  const fmtBtn = (lab, c) => h('button', { class: 'pf-b sm', onmousedown: e => e.preventDefault(), onclick: () => document.execCommand(c) }, lab);
  const presets = h('select', { class: 'pf-select', onchange: e => { const p = e.target.value; e.target.value = ''; const isH = variant.toLowerCase().includes('header'); const set = (l, c, r) => { zones.l.innerHTML = l; zones.c.innerHTML = c; zones.r.innerHTML = r; };
    if (p === 'pagexy') set('', 'Page ' + fieldSpan('PAGE', '1') + ' of ' + fieldSpan('NUMPAGES', '1'), '');
    if (p === 'page') set('', fieldSpan('PAGE', '1'), ''); if (p === 'pager') set('', '', fieldSpan('PAGE', '1'));
    if (p === 'titledate') set(fieldSpan('TITLE', D.title), '', fieldSpan('DATE', ''));
    if (p === 'chapter') set(fieldSpan('STYLEREF 1', 'Chapter'), '', 'Page ' + fieldSpan('PAGE', '1'));
    if (p === 'conf') set('<b>CONFIDENTIAL</b>', '', fieldSpan('DATE', ''));
    if (p === 'author') set(fieldSpan('AUTHOR', D.author), '', fieldSpan('FILENAME', ''));
    if (p === 'blank') set('', '', ''); } }, h('option', { value: '' }, 'Quick layouts…'), [['pagexy', 'Page X of Y (centre)'], ['page', 'Page number (centre)'], ['pager', 'Page number (right)'], ['titledate', 'Title left · date right'], ['chapter', 'Chapter title · page'], ['author', 'Author · file name'], ['conf', 'Confidential · date'], ['blank', 'Clear']].map(([v, l]) => h('option', { value: v }, l)));
  const chk = (k, lab) => h('label', { class: 'pf-row', style: 'margin-right:14px' }, h('input', { type: 'checkbox', checked: opts[k], onchange: e => { save(); opts[k] = e.target.checked; variants(); } }), lab);
  const dist = h('div', { class: 'pf-row', style: 'margin-top:8px' }, 'Header from top (cm)', h('input', { class: 'pf-num', type: 'number', step: .1, value: (D.hf.hdrDist / 10).toFixed(2), id: 'hf-hd' }), 'Footer from bottom (cm)', h('input', { class: 'pf-num', type: 'number', step: .1, value: (D.hf.ftrDist / 10).toFixed(2), id: 'hf-fd' }));
  const scopeSel = h('select', { class: 'pf-select' }, h('option', { value: 'doc', selected: !scopeSec }, 'Whole document'), L.sections().length > 1 ? h('option', { value: 'sec', selected: scopeSec }, 'This section only') : null);

    h('div', { class: 'pf-row', style: 'margin-top:6px' }, fmtBtn('B', 'bold'), fmtBtn('I', 'italic'), fmtBtn('U', 'underline'), h('span', { class: 'pf-note' }, 'Tip: fields such as page numbers update automatically.')),
    zoneBox, h('div', { class: 'pf-row' }, chk('diffFirst', 'Different first page'), chk('diffOddEven', 'Different odd & even pages')), dist,
    h('div', { class: 'pf-row', style: 'margin-top:8px' }, 'Apply to:', scopeSel));

}, { ro: 1 });
PF.def('hfApply', (work, opts, hd, fd, scope) => {

/* ---------- print ---------- */
PF.def('print', () => {
  if (PF.D.label && PF.D.label.noPrint) { document.body.classList.add('pf-noprint'); UI.toast('Printing is blocked by the sensitivity label'); setTimeout(() => document.body.classList.remove('pf-noprint'), 1500); return; }

INS.removeBg = async (el) => {
  const tol = await UI.prompt('Remove background', 'Tolerance (5–80, higher removes more)', 32, { type: 'number' }); if (!tol) return;
  const img = new Image(); img.crossOrigin = 'anonymous'; img.src = el.src; try { await img.decode(); } catch (e) { return UI.toast('This picture cannot be edited'); }
  const c = h('canvas', { width: img.naturalWidth, height: img.naturalHeight }); const x = c.getContext('2d'); x.drawImage(img, 0, 0);
  let d; try { d = x.getImageData(0, 0, c.width, c.height); } catch (e) { return UI.toast('This online picture cannot be edited — download it and insert it from your device'); }
  const W = c.width, H = c.height, px = d.data, seen = new Uint8Array(W * H), q = [];
  const at = (i) => [px[i * 4], px[i * 4 + 1], px[i * 4 + 2]];
  const corners = [0, W - 1, (H - 1) * W, H * W - 1].map(at); const ref = corners.reduce((a, b) => a.map((v, i) => v + b[i] / 4), [0, 0, 0]);
  const close = i => { const p = at(i); return Math.hypot(p[0] - ref[0], p[1] - ref[1], p[2] - ref[2]) < tol * 2.2; };
  for (let i = 0; i < W; i++) { q.push(i, (H - 1) * W + i); } for (let j = 0; j < H; j++) { q.push(j * W, j * W + W - 1); }
  while (q.length) { const i = q.pop(); if (seen[i]) continue; seen[i] = 1; if (!close(i)) continue; px[i * 4 + 3] = 0; const xx = i % W, yy = (i / W) | 0; if (xx > 0) q.push(i - 1); if (xx < W - 1) q.push(i + 1); if (yy > 0) q.push(i - W); if (yy < H - 1) q.push(i + W); }
  x.putImageData(d, 0, 0); PF.hist.checkpoint(); el.src = c.toDataURL('image/png'); PF.changed(); UI.toast('Background removed — use Undo if you want it back');
};
